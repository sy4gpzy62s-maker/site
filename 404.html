<!DOCTYPE html><html lang="ka"><head><meta charset="utf-8"><title></title>
<script>
// Redirects broken URLs to the site's home page (works for user.github.io/repo/ and custom domains)
var p=location.pathname.split('/'),b=location.hostname.endsWith('github.io')&&p[1]?'/'+p[1]+'/':'/';
location.replace(b);
</script></head><body></body></html>
